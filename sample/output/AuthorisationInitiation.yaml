    post:
      tags:
      - Acquirer to Issuer Card Messages
      description: Create AuthorisationInitiation
      operationId: Create AuthorisationInitiation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/APIRequest'
        required: false
      responses:
        '200':
          description: API request processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APIResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - OauthSecurity:
        - api.example.AuthorisationInitiation.Acquirer to Issuer Card Messages
