        * RJCT_NFND - Rejected - not found. Indicates that the resource or information
        associated with the resource was not found.

        * RJCT_SYS - Rejected - system error. Indicates that the request was rejected
        because of a system error.

        * RJCT_TOUT - Rejected - timeout. Indicates a timeout in the resource session
        processing.

        * RJCT_AUTHZ - Rejected - authorization failed. Indicates that the identity
        in context is not authorized to access the resource.

        * RJCT_DPLCT - Rejected - application error. Indicates that duplicate record
